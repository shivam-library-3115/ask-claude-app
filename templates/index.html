<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plush Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="topbar">
  <button type="button" id="history-toggle" class="topbar-btn" title="Your chat history">☰ History</button>
  <div class="topbar-right">
    {% if is_admin %}<a href="{{ url_for('admin') }}" class="topbar-btn">Admin</a>{% endif %}
    <span class="topbar-user">{{ username }}</span>
    <a href="{{ url_for('logout') }}" class="topbar-btn">Log out</a>
  </div>
</div>

<aside id="history-panel" class="history-panel" hidden>
  <div class="history-head">Your history</div>
  <div id="history-list" class="history-list"></div>
</aside>

<header>
  <div class="eyebrow">Plush Intelligence</div>
  <h1>Plush Buddy</h1>
  <p>Ask anything about your data.</p>
</header>

<main id="log">
  <div class="empty-state" id="empty-state">No questions yet.<br>Ask something to get started.</div>
</main>

<form id="ask-form">
  <div class="model-row">
    <select id="model-select" class="model-select">
      <option value="claude-haiku-4-5-20251001" {% if default_model == 'claude-haiku-4-5-20251001' %}selected{% endif %}>Haiku 4.5 — fastest, cheapest</option>
      <option value="claude-sonnet-5" {% if default_model == 'claude-sonnet-5' %}selected{% endif %}>Sonnet 5 — balanced{% if default_model == 'claude-sonnet-5' %} (default){% endif %}</option>
      <option value="claude-opus-4-8" {% if default_model == 'claude-opus-4-8' %}selected{% endif %}>Opus 4.8 — stronger reasoning{% if default_model == 'claude-opus-4-8' %} (default){% endif %}</option>
      <option value="claude-fable-5" {% if default_model == 'claude-fable-5' %}selected{% endif %}>Fable 5 — best available{% if default_model == 'claude-fable-5' %} (default){% endif %}</option>
    </select>
  </div>
  <div class="input-wrap">
    <textarea id="question" rows="1" placeholder="Ask something…" required></textarea>
    <button type="button" id="stop-btn" class="stop-btn" hidden>Stop</button>
    <button type="submit" id="submit-btn">Ask</button>
  </div>
</form>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
