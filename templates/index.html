<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plush Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

{% if auth_enabled %}<a href="{{ url_for('logout') }}" class="logout-link">Log out</a>{% endif %}

<header>
  <div class="eyebrow">Plush Intelligence</div>
  <h1>Plush Buddy</h1>
  <p>Ask anything about your data.</p>
</header>

<main id="log">
  <div class="empty-state" id="empty-state">No questions yet.<br>Ask something to get started.</div>
</main>

<form id="ask-form">
  <div class="input-wrap">
    <textarea id="question" rows="1" placeholder="Ask something…" required></textarea>
    <button type="button" id="stop-btn" class="stop-btn" hidden>Stop</button>
    <button type="submit" id="submit-btn">Ask</button>
  </div>
</form>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
